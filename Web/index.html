<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remotey">
<meta name="theme-color" content="#25272c">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="remote.css">
<title>Remotey</title>
<script type="module" src="remote.js"></script>
</head>
<body data-page="media">
<div id="app">
  <div id="console">
    <div id="screen">
      <div id="picture">
        <canvas id="view" hidden></canvas>
        <div id="aim" hidden><div id="marker"></div><img id="cursor" alt=""></div>
      </div>
      <div id="pad" aria-label="Trackpad"></div>
      <!-- Printed on the display's glass: state on the left, zoom on the right. Only the keys take touches. -->
      <div id="hud">
        <span id="status" role="status"><span class="sr">Verbinde…</span></span>
        <div id="meter" class="idle" role="img" aria-label="Live-Bild: noch keine Messung">
          <span><b>0</b> fps</span><span>– ms</span>
        </div>
        <span id="follow" class="legend" hidden>Folgt Text</span>
        <div id="zoom" role="group" aria-label="Zoom des Live-Bilds">
          <button class="key" data-act="zoom" data-step="-1" aria-label="Verkleinern">−</button>
          <!-- The readout is a key with a lamp: "Auto" fits the view to the window in front on the Mac. The lamp
               says "Form" while that window also takes the phone's shape. -->
          <button class="readout" data-act="fit" aria-pressed="false" aria-label="Zoom 0,5×. Auto aus"><span id="fitLamp" class="legend">Auto</span><span id="zoomValue">0,5×</span></button>
          <button class="key" data-act="zoom" data-step="1" aria-label="Vergrößern">+</button>
        </div>
      </div>
    </div>
    <!-- The tray: slides up out of the display's lower edge, so the live view keeps its size. -->
    <div id="drawer" class="sheet">
      <div class="grip" aria-hidden="true"></div>
      <div id="pages" class="switch legend" role="group" aria-label="Tastenseite">
        <i></i>
        <button class="legend" data-act="page" data-page="media">Medien</button>
        <button class="legend" data-act="page" data-page="keys">Tasten</button>
        <button class="legend" data-act="page" data-page="settings">Regler</button>
      </div>
      <div id="deck">
        <div class="track">
          <div class="page media" data-page="media" role="group" aria-label="Medien">
            <div class="transport">
              <button data-media="prev" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zM20 5v14l-10-7z"/></svg></button>
              <button class="play" data-media="play" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><path d="M3 5l9 7-9 7zM14 5h3v14h-3zM19 5h3v14h-3z"/></svg></button>
              <button data-media="next" aria-label="Nächster Titel"><svg viewBox="0 0 24 24"><path d="M16 5h3v14h-3zM4 5l10 7-10 7z"/></svg></button>
            </div>
            <button class="cap" data-media="mute" aria-label="Stumm">
              <svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM15.3 9.3l1.4-1.4L19 10.2l2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3z"/></svg>
            </button>
            <div class="rocker" role="group" aria-label="Lautstärke">
              <button data-media="volup" data-repeat aria-label="Lauter">+</button>
              <button data-media="voldown" data-repeat aria-label="Leiser">−</button>
            </div>
          </div>
          <div class="page keys" data-page="keys" role="group" aria-label="Tasten">
            <button class="cap legend" data-key="escape">Esc</button>
            <button class="cap legend" data-key="tab">Tab</button>
            <button class="cap legend" data-key="space">Leer</button>
            <button class="cap" data-key="backspace" data-repeat aria-label="Löschen">⌫</button>
            <button class="cap" data-key="return" aria-label="Enter">↵</button>
            <!-- The zoom of the app in front: browsers, editors and terminals scale their content on these. -->
            <button class="cap pair" data-key="-" data-with="cmd" aria-label="App verkleinern, Command Minus">⌘−</button>
            <button class="cap pair" data-key="0" data-with="cmd" aria-label="App auf normale Größe, Command 0">⌘0</button>
            <button class="cap pair" data-key="+" data-with="cmd" aria-label="App vergrößern, Command Plus">⌘+</button>
            <button class="cap" data-mod="cmd" aria-label="Command">⌘</button>
            <button class="cap" data-mod="alt" aria-label="Option">⌥</button>
            <button class="cap" data-mod="ctrl" aria-label="Control">⌃</button>
            <button class="cap" data-mod="shift" aria-label="Shift">⇧</button>
            <button class="cap" data-key="left" data-repeat aria-label="Links">←</button>
            <button class="cap" data-key="down" data-repeat aria-label="Runter">↓</button>
            <button class="cap" data-key="up" data-repeat aria-label="Hoch">↑</button>
            <button class="cap" data-key="right" data-repeat aria-label="Rechts">→</button>
          </div>
          <div class="page settings" data-page="settings" role="group" aria-label="Regler">
            <div class="setting" data-setting="speed">
              <span class="name"><span class="legend">Tempo</span><output></output></span>
              <div class="slider" role="slider" tabindex="0" aria-label="Zeigertempo"><b></b></div>
            </div>
            <div class="setting" data-setting="acceleration">
              <span class="name"><span class="legend">Beschl.</span><output></output></span>
              <div class="slider" role="slider" tabindex="0" aria-label="Beschleunigung: schnelle Bewegungen reichen weiter"><b></b></div>
            </div>
            <div class="setting" data-setting="scroll">
              <span class="name"><span class="legend">Scroll</span><output></output></span>
              <div class="slider" role="slider" tabindex="0" aria-label="Scrolltempo"><b></b></div>
            </div>
            <button class="cap legend reset" data-act="settings-reset" aria-label="Regler zurücksetzen">Std.</button>
          </div>
        </div>
      </div>
    </div>
    <!-- The switcher: the Mac's open apps, out of the same edge. An app with several windows shows them to choose from.
         Under them, on a Mac with more than one display, the displays as they are arranged: a tap puts the pointer there. -->
    <div id="switcher" class="sheet" role="group" aria-label="Apps am Mac">
      <div class="grip" aria-hidden="true"></div>
      <div class="head">
        <button class="key" data-act="apps-back" aria-label="Zurück zu allen Apps" hidden><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
        <span class="icon" hidden><img id="appsIcon" alt=""><span class="letter"></span></span>
        <span id="appsTitle" class="legend">Offene Apps</span>
        <span id="appsNote" class="legend"></span>
        <!-- With "Auto": the window in front takes the phone's shape on the Mac, and its old frame back afterwards. -->
        <button class="key legend" data-act="shape" aria-pressed="false" aria-label="Telefonform: das vordere Fenster nimmt am Mac die Form des Telefons an">Telefonform</button>
      </div>
      <div class="well"><div id="apps" role="group" aria-label="Offene Apps" aria-live="polite"></div></div>
      <div id="displays" role="group" aria-label="Displays des Macs" hidden></div>
    </div>
  </div>
  <!-- Under the thumb: mouse keys with the side buttons for back and forward, then the keys that open things:
       the keyboard, the Mac's apps, the tray. -->
  <div id="dock">
    <div class="mouse">
      <!-- A mouse's side buttons, on the side where the thumb finds them on a mouse. -->
      <div class="side" role="group" aria-label="Seitentasten der Maus">
        <button data-click="back" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
        <button data-click="forward" aria-label="Vorwärts"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
      </div>
      <button class="legend" data-hold="left" aria-label="Linke Maustaste, halten zum Ziehen">Links</button>
      <button class="legend" data-click="right" aria-label="Rechte Maustaste">Rechts</button>
    </div>
    <div class="tools">
      <!-- While the Mac is locked, the key opens the same field for its password: a padlock instead of a keyboard. -->
      <button class="slot" data-act="type" aria-label="Tastatur öffnen">
        <svg class="open" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M7 10h.01M12 10h.01M17 10h.01M8 14h8"/></svg>
        <svg class="shut" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span id="typeLabel">Tippen…</span>
      </button>
      <button class="key legend" data-act="apps" aria-label="Apps und Fenster am Mac" aria-expanded="false">Apps</button>
      <button class="key" data-act="deck" aria-label="Medien, Tasten und Regler" aria-expanded="false">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
      </button>
      <button class="key legend" id="viewBtn" data-act="view" aria-label="Live-Bild ein oder aus">Bild</button>
    </div>
  </div>
  <!-- While typing: the keys the iOS keyboard lacks sit right above it, next to the field. -->
  <div id="typebar">
    <div id="accessory" role="group" aria-label="Sondertasten">
      <button class="cap legend" data-key="escape">Esc</button>
      <button class="cap legend" data-key="tab">Tab</button>
      <button class="cap" data-mod="cmd" aria-label="Command">⌘</button>
      <button class="cap" data-mod="alt" aria-label="Option">⌥</button>
      <button class="cap" data-mod="ctrl" aria-label="Control">⌃</button>
      <button class="cap" data-mod="shift" aria-label="Shift">⇧</button>
      <button class="cap" data-key="left" data-repeat aria-label="Links">←</button>
      <button class="cap" data-key="down" data-repeat aria-label="Runter">↓</button>
      <button class="cap" data-key="up" data-repeat aria-label="Hoch">↑</button>
      <button class="cap" data-key="right" data-repeat aria-label="Rechts">→</button>
    </div>
    <div id="slot">
      <input id="field" type="text" inputmode="text" enterkeyhint="send"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Text an den Mac senden">
    </div>
    <button id="done" class="cap accent legend" data-act="done">Fertig</button>
  </div>
</div>
</body>
</html>
