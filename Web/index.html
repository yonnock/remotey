<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remotey">
<meta name="theme-color" content="#34373d">
<link rel="apple-touch-icon" href="/icon.png">
<title>Remotey</title>
<style>
  /* A hardware remote: graphite body, key caps with a visible edge that sink when pressed. */
  :root {
    --body-top: #34373d; --body-bottom: #1b1d21; --deep: #111214; --surface: #1c1e22; --cap: #2a2d33;
    --edge: #0a0b0c; --line: #33373e; --text: #eceef0; --muted: #8b8f98;
    --accent: #f2b84b; --accent-ink: #231803; --bad: #ef6b5e; --glass: rgba(17, 18, 20, .72);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--body-bottom); color: var(--text); overflow: hidden;
    font: 500 15px/1.2 -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #app { position: absolute; top: 0; left: 0; right: 0; height: var(--vh, 100dvh); display: flex;
    flex-direction: column; gap: 10px; background: linear-gradient(180deg, var(--body-top), var(--body-bottom));
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }

  #top { display: flex; gap: 10px; align-items: center; }
  #field { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--edge);
    background: var(--deep); color: var(--text); font-size: 16px; outline: none; box-shadow: inset 0 2px 5px var(--edge);
    -webkit-user-select: text; user-select: text; }
  #field:focus { border-color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status.bad { color: var(--bad); }

  /* Display: the live view. Small above the trackpad, or the whole phone in pointer mode. */
  #screen { flex: 0 0 27%; position: relative; overflow: hidden; border-radius: 10px; background: var(--deep);
    border: 3px solid var(--edge); box-shadow: inset 0 0 12px var(--edge); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; }
  #marker { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    border: 2px solid var(--accent); pointer-events: none; }
  #grow { position: absolute; right: 6px; bottom: 6px; padding: 4px 8px; border-radius: 7px; font-size: 11px;
    background: var(--glass); color: var(--text); pointer-events: none; }

  #pad { flex: 1; min-height: 60px; border-radius: 14px; touch-action: none; display: flex; align-items: center;
    justify-content: center; text-align: center; color: var(--muted); font-size: 13px; padding: 24px;
    background-color: var(--surface); background-image: radial-gradient(var(--line) 1px, transparent 1.4px);
    background-size: 12px 12px; box-shadow: inset 0 2px 6px var(--edge); }

  .row { display: flex; gap: 8px; padding-bottom: 4px; }
  button { font: inherit; color: var(--text); border: 0; padding: 0; margin: 0; touch-action: none; }
  .cap { flex: 1; min-width: 0; height: 40px; border-radius: 9px; background: var(--cap);
    box-shadow: 0 4px 0 var(--edge); transition: transform .05s, box-shadow .05s; }
  .cap.pressed, .cap:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .cap.on { color: var(--accent); box-shadow: 0 4px 0 var(--accent); }
  .cap.on.pressed { box-shadow: 0 1px 0 var(--accent); }
  .cap.accent { background: var(--accent); color: var(--accent-ink); }
  .cap.small { font-size: 13px; }
  .mouse .cap { height: 50px; }

  .deck { gap: 12px; align-items: flex-start; }
  .dial { flex: none; width: 132px; height: 132px; border-radius: 50%; background: var(--cap);
    box-shadow: 0 4px 0 var(--edge); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
  .dial button { background: none; color: var(--muted); font-size: 22px; display: grid; place-items: center; }
  .dial button.pressed, .dial button:active { color: var(--accent); }
  .dial svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
  .dial .ok { border-radius: 50%; background: var(--deep); color: var(--text); }
  .dial .ok.pressed, .dial .ok:active { background: var(--accent); color: var(--accent-ink); }
  .keys { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; }
  .keys .cap { height: 36px; }

  .kb-only { display: none; }
  body.kb .kb-only { display: flex; }
  body.kb .hide-kb { display: none; }

  /* Pointer mode: the display fills the phone, the whole screen is the trackpad, keys float in a dock. */
  #dock { display: none; }
  body.full #top, body.full .row { display: none; }
  body.full #screen { position: fixed; inset: 0; border: 0; border-radius: 0; box-shadow: none; }
  body.full #grow { display: none; }
  body.full #pad { position: fixed; inset: 0; z-index: 2; border-radius: 0; background: none; box-shadow: none; }
  body.full #dock { display: flex; gap: 6px; position: fixed; z-index: 3; padding: 8px; border-radius: 20px;
    left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom)); background: var(--glass);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #dock button { flex: 1; min-width: 0; height: 46px; border-radius: 12px; background: var(--cap); font-size: 14px; }
  #dock button.pressed, #dock button:active { background: var(--line); }
  @media (prefers-reduced-motion: reduce) { .cap { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <input id="field" type="text" inputmode="text" enterkeyhint="send" placeholder="Tippen…"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Text an den Mac senden">
    <span id="status" role="status">Verbinde…</span>
  </div>
  <div id="screen" role="button" aria-label="Live-Bild, antippen für Vollbild" hidden>
    <canvas id="view"></canvas>
    <div id="marker" hidden></div>
    <div id="grow">Vollbild</div>
  </div>
  <div id="pad" aria-label="Trackpad"></div>
  <div class="row mouse hide-kb">
    <button class="cap" data-hold="left" style="flex:2">Links</button>
    <button class="cap" data-click="right">Rechts</button>
  </div>
  <div class="row deck hide-kb">
    <div class="dial" role="group" aria-label="Medien">
      <span></span>
      <button data-media="volup" data-repeat aria-label="Lauter">+</button>
      <span></span>
      <button data-media="prev" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zM20 5v14l-10-7z"/></svg></button>
      <button class="ok" data-media="play" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><path d="M3 5l9 7-9 7zM14 5h3v14h-3zM19 5h3v14h-3z"/></svg></button>
      <button data-media="next" aria-label="Nächster Titel"><svg viewBox="0 0 24 24"><path d="M16 5h3v14h-3zM4 5l10 7-10 7z"/></svg></button>
      <span></span>
      <button data-media="voldown" data-repeat aria-label="Leiser">−</button>
      <span></span>
    </div>
    <div class="keys">
      <button class="cap small" data-key="escape">Esc</button>
      <button class="cap small" data-key="tab">Tab</button>
      <button class="cap" data-key="backspace" data-repeat aria-label="Löschen">⌫</button>
      <button class="cap small" data-key="space">Leer</button>
      <button class="cap" data-key="return" aria-label="Enter">↵</button>
      <button class="cap small accent" data-act="type">Tippen</button>
      <button class="cap small" data-media="mute">Stumm</button>
      <button class="cap small" id="viewBtn" data-act="view" aria-label="Live-Bild ein oder aus">Bild</button>
      <button class="cap small" data-act="zoom" aria-label="Zoom des Live-Bilds">0,5×</button>
    </div>
  </div>
  <div class="row kb-only">
    <button class="cap small" data-key="escape">Esc</button>
    <button class="cap small" data-key="tab">Tab</button>
    <button class="cap small accent" data-act="done">Fertig</button>
  </div>
  <div class="row mods">
    <button class="cap" data-mod="cmd" aria-label="Command">⌘</button>
    <button class="cap" data-mod="alt" aria-label="Option">⌥</button>
    <button class="cap" data-mod="ctrl" aria-label="Control">⌃</button>
    <button class="cap" data-mod="shift" aria-label="Shift">⇧</button>
    <button class="cap" data-key="left" data-repeat aria-label="Links">←</button>
    <button class="cap" data-key="down" data-repeat aria-label="Runter">↓</button>
    <button class="cap" data-key="up" data-repeat aria-label="Hoch">↑</button>
    <button class="cap" data-key="right" data-repeat aria-label="Rechts">→</button>
  </div>
  <div id="dock">
    <button data-hold="left" style="flex:2">Links</button>
    <button data-click="right" style="flex:1.5">Rechts</button>
    <button data-act="zoom" aria-label="Zoom des Live-Bilds">0,5×</button>
    <button data-act="full" aria-label="Zurück zur Fernbedienung">Tasten</button>
  </div>
</div>
<script type="module">
import { LiveView } from './live-view.js';
const $ = (s) => document.querySelector(s);
const statusEl = $('#status'), pad = $('#pad'), field = $('#field');

// ---- Token: arrives in the URL fragment (never sent to the server). The fragment stays in the URL
// so "Zum Home-Bildschirm" keeps it; localStorage is the fallback for plain Safari tabs.
let token = decodeURIComponent(location.hash.slice(1));
try {
  if (token) localStorage.setItem('remotey-token', token);
  else token = localStorage.getItem('remotey-token') || '';
} catch {}

// ---- Connection
let ws = null, liveView = null, ready = false, denied = false, retryTimer = 0;
function setStatus(text, bad) { statusEl.textContent = text; statusEl.classList.toggle('bad', !!bad); }

function connect() {
  clearTimeout(retryTimer);
  if (!token) { pad.textContent = 'Kein Zugangsschlüssel. Am Mac im Remotey-Menü „iPhone koppeln“ wählen und den QR-Code scannen.'; return setStatus('Nicht gekoppelt', true); }
  if (denied) return;
  liveView?.close();
  if (ws) { ws.onclose = null; ws.close(); }
  ready = false;
  const url = location.protocol === 'https:' ? `wss://${location.host}/ws` : `ws://${location.hostname}:47801`;
  const socket = ws = new WebSocket(url);
  socket.binaryType = 'arraybuffer';
  const player = liveView = new LiveView(view, marker, {
    visible: () => viewOn,
    shown: (n) => { if (socket === ws && socket.readyState === 1) socket.send(JSON.stringify({ t: 'shown', n })); },
    fallback: () => { if (socket === ws) syncView(); },
  });
  socket.onopen = () => socket.send(JSON.stringify({ t: 'auth', token }));
  socket.onmessage = (e) => {
    if (socket !== ws) return;
    if (typeof e.data !== 'string') { player.receive(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.t === 'ok') {
      ready = true;
      pad.textContent = m.ax ? '' : 'Am Mac fehlt die Bedienungshilfen-Freigabe für Remotey (Systemeinstellungen, Datenschutz & Sicherheit).';
      setStatus(m.ax ? 'Verbunden' : 'Freigabe fehlt', !m.ax);
      syncView();
    } else if (m.t === 'view' && m.ok === false) {
      viewOn = false;
      syncView();
      pad.textContent = 'Am Mac fehlt die Freigabe „Bildschirmaufnahme“ für Remotey. Dort erlauben, Remotey neu starten, dann „Bild“ erneut antippen.';
    } else if (m.t === 'denied') {
      denied = true;
      pad.textContent = 'Zugangsschlüssel ungültig. Am Mac neu koppeln und den QR-Code scannen.';
      setStatus('Abgelehnt', true);
    }
  };
  socket.onclose = () => {
    if (socket !== ws) return;
    ready = false;
    player.close();
    if (denied) return;
    setStatus('Getrennt', true);
    if (document.visibilityState === 'visible') retryTimer = setTimeout(connect, 1000);
  };
}
function send(msg) { if (ready && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

// iOS suspends sockets in the background without closing them, so reconnect on every return.
let wakeLock = null;
async function keepAwake() {
  try { if (!wakeLock || wakeLock.released) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { connect(); keepAwake(); }
});

// ---- Sticky modifiers (apply to the next key, then release)
const mods = new Set();
function takeMods() {
  const list = [...mods];
  mods.clear();
  document.querySelectorAll('[data-mod]').forEach((b) => b.classList.remove('on'));
  return list;
}
function sendKey(k) { send({ t: 'key', k, mods: takeMods(), n: 1 }); }

// ---- Trackpad: 1 finger moves, 2 fingers scroll, tap = click, 2-finger tap = right click
const TAP_MS = 250, TAP_SLOP = 8;
const points = new Map();
let gesture = null, moveX = 0, moveY = 0, scrollX = 0, scrollY = 0, frame = 0;

function flush() {
  frame = 0;
  if (moveX || moveY) { send({ t: 'm', dx: moveX, dy: moveY }); moveX = moveY = 0; }
  if (scrollX || scrollY) { send({ t: 's', dx: scrollX, dy: scrollY }); scrollX = scrollY = 0; }
}
pad.addEventListener('touchstart', (e) => {
  e.preventDefault();
  keepAwake();
  if (!points.size) gesture = { start: e.timeStamp, travel: 0, fingers: 0 };
  for (const t of e.changedTouches) points.set(t.identifier, { x: t.clientX, y: t.clientY, time: e.timeStamp });
  gesture.fingers = Math.max(gesture.fingers, points.size);
}, { passive: false });
pad.addEventListener('touchmove', (e) => {
  e.preventDefault();
  let dx = 0, dy = 0, dt = 16;
  for (const t of e.changedTouches) {
    const p = points.get(t.identifier);
    if (!p) continue;
    dx += t.clientX - p.x; dy += t.clientY - p.y;
    dt = Math.max(1, e.timeStamp - p.time);
    p.x = t.clientX; p.y = t.clientY; p.time = e.timeStamp;
  }
  const dist = Math.hypot(dx, dy);
  if (!gesture || !dist) return;
  const wasTap = gesture.travel < TAP_SLOP;
  gesture.travel += dist;
  if (wasTap && gesture.travel < TAP_SLOP) return; // dead zone so a tap does not nudge the cursor
  if (points.size === 1) {
    const gain = 1 + Math.min(3.5, (dist / dt) * 2.2); // slow = precise, fast = far
    moveX += dx * gain; moveY += dy * gain;
  } else {
    scrollX += (dx / points.size) * 1.6; scrollY += (dy / points.size) * 1.6;
  }
  if (!frame) frame = requestAnimationFrame(flush);
}, { passive: false });
function padEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) points.delete(t.identifier);
  if (points.size || !gesture) return;
  if (e.type === 'touchend' && gesture.travel < TAP_SLOP && e.timeStamp - gesture.start < TAP_MS) {
    send({ t: 'c', b: gesture.fingers >= 2 ? 'right' : 'left' });
  }
  gesture = null;
}
pad.addEventListener('touchend', padEnd, { passive: false });
pad.addEventListener('touchcancel', padEnd, { passive: false });

// ---- Live view: the Mac streams the screen region around the cursor into the display.
// The display sits above the trackpad; in pointer mode ("full") it fills the phone.
const screenEl = $('#screen'), view = $('#view'), marker = $('#marker');
const ZOOMS = [0.5, 1, 1.5, 2];
let viewOn = false, full = false, zoom = ZOOMS[0];
try {
  viewOn = localStorage.getItem('remotey-view') === '1';
  if (ZOOMS.includes(+localStorage.getItem('remotey-zoom'))) zoom = +localStorage.getItem('remotey-zoom');
} catch {}
function syncView() {
  if (!viewOn) full = false;
  document.body.classList.toggle('full', full);
  screenEl.hidden = !viewOn;
  if (!viewOn) marker.hidden = true;
  $('#viewBtn').classList.toggle('on', viewOn);
  document.querySelectorAll('[data-act=zoom]').forEach((b) => { b.textContent = String(zoom).replace('.', ',') + '×'; });
  try { localStorage.setItem('remotey-view', viewOn ? '1' : '0'); localStorage.setItem('remotey-zoom', zoom); } catch {}
  const r = screenEl.getBoundingClientRect(); // measured after the layout change above
  send({ t: 'view', on: viewOn, w: r.width, h: r.height, zoom, dpr: window.devicePixelRatio || 2, codec: liveView?.codec || 'jpeg' });
}
function setFull(on) {
  full = on;
  if (on) { viewOn = true; field.blur(); }
  syncView();
}
// Tapping the small display opens pointer mode. In pointer mode the trackpad covers the display.
screenEl.addEventListener('touchend', (e) => { e.preventDefault(); setFull(true); }, { passive: false });
screenEl.addEventListener('click', () => setFull(true));

// ---- Buttons. preventDefault on touchstart keeps the iOS keyboard open.
function fire(b) {
  const d = b.dataset;
  if (d.act === 'view') { viewOn = !viewOn; syncView(); }
  else if (d.act === 'zoom') { zoom = ZOOMS[(ZOOMS.indexOf(zoom) + 1) % ZOOMS.length]; viewOn = true; syncView(); }
  else if (d.act === 'full') setFull(!full);
  else if (d.act === 'done') field.blur();
  else if (d.act === 'type') field.focus();
  else if (d.key) sendKey(d.key);
  else if (d.media) send({ t: 'media', k: d.media });
  else if (d.click) send({ t: 'c', b: d.click });
  else if (d.mod) { mods.has(d.mod) ? mods.delete(d.mod) : mods.add(d.mod); b.classList.toggle('on', mods.has(d.mod)); }
}
document.querySelectorAll('button').forEach((b) => {
  let delay = 0, repeat = 0;
  const stop = () => { clearTimeout(delay); clearInterval(repeat); };
  b.addEventListener('touchstart', (e) => {
    e.preventDefault();
    keepAwake();
    b.classList.add('pressed');
    if (b.dataset.hold) return send({ t: 'b', b: b.dataset.hold, d: true });
    if (b.dataset.act === 'type') return; // iOS opens the keyboard only for a focus made on touchend
    fire(b);
    if ('repeat' in b.dataset) delay = setTimeout(() => { repeat = setInterval(() => fire(b), 70); }, 400);
  }, { passive: false });
  const end = (e) => {
    e.preventDefault();
    stop();
    b.classList.remove('pressed');
    if (b.dataset.hold) send({ t: 'b', b: b.dataset.hold, d: false });
    if (b.dataset.act === 'type' && e.type === 'touchend') field.focus();
  };
  b.addEventListener('touchend', end, { passive: false });
  b.addEventListener('touchcancel', end, { passive: false });
  // Mouse/keyboard fallback for desktop browsers and assistive tech.
  b.addEventListener('click', () => { if (b.dataset.hold) send({ t: 'c', b: b.dataset.hold }); else fire(b); });
});

// ---- Keyboard: the field mirrors what was typed; every change is diffed and replayed on the Mac.
// A zero-width sentinel keeps the field non-empty so backspace still produces an input event.
const SENTINEL = '​';
const segmenter = window.Intl && Intl.Segmenter ? new Intl.Segmenter() : null;
const graphemes = (s) => (segmenter ? [...segmenter.segment(s)].length : Array.from(s).length);
let prev = SENTINEL;
function resetField() { field.value = prev = SENTINEL; }
resetField();

field.addEventListener('input', (e) => {
  if (e.isComposing) return;
  const cur = field.value;
  let p = 0;
  const max = Math.min(prev.length, cur.length);
  while (p < max && prev[p] === cur[p]) p++;
  if (p > 0 && prev.charCodeAt(p - 1) >= 0xd800 && prev.charCodeAt(p - 1) <= 0xdbff) p--; // keep surrogate pairs whole
  const removed = prev.slice(p).replace(SENTINEL, ''), added = cur.slice(p).replace(SENTINEL, '');
  const deleting = prev.length > p;
  if (deleting) send({ t: 'key', k: 'backspace', mods: [], n: Math.max(1, graphemes(removed)) });
  if (added) {
    if (mods.size && graphemes(added) === 1) { sendKey(added.toLowerCase()); return resetField(); }
    send({ t: 'text', s: added });
  }
  prev = cur;
  if (!cur.startsWith(SENTINEL) || (cur.length > 60 && cur.endsWith(' '))) resetField();
});
field.addEventListener('compositionend', () => field.dispatchEvent(new Event('input')));
field.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendKey('return'); resetField(); }
});
field.addEventListener('focus', () => { keepAwake(); document.body.classList.add('kb'); });
field.addEventListener('blur', () => { document.body.classList.remove('kb'); resetField(); });

// ---- Layout follows the visible viewport so the keyboard shrinks the trackpad instead of covering it.
function fit() {
  const h = window.visualViewport ? visualViewport.height : innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
  scrollTo(0, 0);
  if (viewOn) syncView(); // the display changed size, so the captured region must follow
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
addEventListener('resize', fit);
document.addEventListener('gesturestart', (e) => e.preventDefault());
fit();
connect();
keepAwake();
</script>
</body>
</html>
